name: Publish npm package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install publishing CLI and dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Verify release source and version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test "$GITHUB_REF_NAME" = "v$version"
          if [[ "$version" == *-* ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
            echo 'NPM_TAG=beta' >> "$GITHUB_ENV"
          else
            echo 'NPM_TAG=latest' >> "$GITHUB_ENV"
          fi
      - run: npm test
      - name: Build and check package contents
        shell: bash
        run: |
          npm run build:lib
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/package.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const [pack] = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/package.json`));
          const files = pack.files.map(file => file.path);
          for (const file of files) {
            if (!file.startsWith('dist/') && !['README.md', 'LICENSE', 'package.json'].includes(file)) {
              throw new Error(`Unexpected package file: ${file}`);
            }
          }
          for (const file of ['dist/index.js', 'dist/index.d.ts', 'dist/styles.css', 'dist/fonts/fonts.css']) {
            if (!files.includes(file)) throw new Error(`Missing package file: ${file}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_TARBALL=${pack.filename}\n`);
          JS
      - name: Publish using npm Trusted Publishing
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: npm publish "$NPM_TARBALL" --tag "$NPM_TAG" --access public --provenance --ignore-scripts
      - name: Verify registry version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          npm view "uagray@$version" version dist.integrity --json
      - name: Validation without publishing
        if: github.ref_type != 'tag' || github.event_name == 'workflow_dispatch'
        run: echo 'Package validation passed. Push a matching version tag to publish.'
